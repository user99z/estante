/* Estante 8.1: áreas de toque, player e hierarquia responsiva, sem alterar componentes Telegram. */
.tg-resume-choice{display:grid;gap:10px;margin-top:10px}
.tg-resume-tile{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);cursor:pointer;min-height:74px}
.tg-resume-tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.tg-resume-tile .ico{color:var(--accent);flex:none}
.tg-resume-tile span{display:grid;gap:3px}
.tg-resume-tile strong{font-weight:720;font-size:13px}
.tg-resume-tile small{color:var(--muted);font-size:12px}
.estante-pwa-panel{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px}
.estante-pwa-panel>div{min-width:0;flex:1 1 240px}
.estante-pwa-panel h2{font-size:15px;margin:0 0 5px}
.estante-pwa-panel p{color:var(--muted);font-size:12px;margin:0 0 7px}
.tg-player-stage{border-radius:12px;overflow:hidden;background:#000}
.tg-player-stage video{display:block;max-height:min(64dvh,650px);width:100%;object-fit:contain}
.tg-player .tg-player-actions{gap:8px;align-items:center}
.tg-player .tg-player-actions .btn{min-height:40px}
@media(max-width:780px){
 .top-inner,.top-actions{min-width:0}
 .top-actions{gap:2px}
 .content{padding-bottom:32px}
 .page-header{gap:13px}
 .page-header .header-actions{margin-left:0}
 .header-actions>.btn{min-height:42px}
 .lesson-card{align-items:flex-start}
 .lesson-actions{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:8px;width:100%;padding:8px 0 0!important}
 .lesson-actions>*{flex-shrink:0}
 .tg-lesson-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;min-width:0}
 .tg-lesson-bar .tg-mini{min-height:39px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
 .course-banner{max-height:180px}
 .editor-toolbar-actions{justify-content:stretch}
 .modal-layer:has(.tg-player){padding:6px;align-items:center}
 .modal:has(.tg-player){width:100%;max-height:96dvh;border-radius:14px;overscroll-behavior:contain}
 .modal:has(.tg-player) .modal-head{padding:13px 16px 8px}
 .modal:has(.tg-player) .modal-head h2{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
 .modal:has(.tg-player) .modal-body{padding:0 12px 12px}
 .tg-player-stage video{max-height:50dvh}
 .tg-player .tg-player-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .tg-player .tg-player-actions>*{min-width:0;width:100%;white-space:normal}
 .tg-player .tg-player-actions .tg-speed{grid-column:1 / -1;display:flex;justify-content:flex-start}
 .tg-player .tg-player-actions .btn{white-space:normal}
}
@media(max-width:420px){
 .topbar{padding-inline:10px}
 .content{padding-left:12px;padding-right:12px}
 .top-actions>.btn.icon,.top-actions>#cloud-sync-top{width:38px!important;min-width:38px!important}
 .course-title,.subject-main strong{overflow-wrap:anywhere}
 .lesson-card{padding:13px 12px}
 .tg-player .tg-player-actions{grid-template-columns:1fr 1fr}
 .tg-resume-tile{padding:14px;min-height:68px}
 .estante-pwa-panel .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){.tg-resume-tile{transition:none}}
</style><style id="estante83-unified-identity">
/* Estante 8.3 — sistema visual único, sem alterar os dados nem integrações. */
:root,html[data-theme="dark"]{
 --bg:#11191B;--surface:#192426;--surface-2:#202E30;--surface-3:#29393B;
 --ink:#EDF5F2;--muted:#ADC0BD;--faint:#8DA5A1;--border:#344749;
 --border-strong:#496264;--accent:#8BDBCA;--accent-hover:#A5E6D9;
 --accent-soft:#263E3D;--on-accent:#15312E;--coral:#D89179;
 --positive:#91DDB5;--shadow:0 8px 26px rgba(0,0,0,.07);
 --max:1140px;--header:76px;color-scheme:dark;
}
html[data-theme="light"]{
 --bg:#F1F5F3;--surface:#FFFFFF;--surface-2:#F5F8F7;--surface-3:#E9F0ED;
 --ink:#1D3233;--muted:#607573;--faint:#718784;--border:#DFE8E4;
 --border-strong:#C9D9D3;--accent:#196D69;--accent-hover:#135651;
 --accent-soft:#E6F3EE;--on-accent:#FFFFFF;--coral:#B66D55;
 --positive:#23795F;--shadow:0 6px 22px rgba(24,49,42,.035);
 --max:1140px;--header:76px;color-scheme:light;
}
html{scroll-padding-top:88px}
body{font-size:14px;letter-spacing:-.003em}
.topbar{height:var(--header)!important;background:var(--surface);padding-inline:28px!important;border-bottom:1px solid var(--border)!important}
.top-inner{max-width:var(--max)!important;gap:22px}
.topbar-brand{gap:12px!important;min-height:52px!important;white-space:nowrap}
.topbar-brand .brand-mark{height:46px!important;width:46px!important;min-width:46px!important;border-radius:13px!important;overflow:hidden!important;background:transparent!important;border:none!important;box-shadow:none!important;color:inherit!important;display:grid!important;place-items:center!important}
.topbar-brand #logo-mark svg{display:block!important;height:46px!important;width:46px!important;stroke:none!important;fill:none}
.topbar-brand-text{font-size:23px!important;font-weight:780!important;letter-spacing:-1.05px!important}
.topbar-brand .brand-dot{color:var(--coral)!important}
.topbar-brand:hover .topbar-brand-text{color:var(--ink)!important}
.top-actions{gap:5px!important}
.top-actions>.search-launch,.top-actions>.btn.icon,.top-actions>#cloud-sync-top{
 width:42px!important;min-width:42px!important;max-width:42px!important;height:42px!important;min-height:42px!important;max-height:42px!important;
 border-radius:12px!important;background:transparent!important;border:1px solid transparent!important;color:var(--muted)!important;
 display:flex!important;align-items:center!important;justify-content:center!important;padding:0!important;
}
.top-actions>.search-launch:hover,.top-actions>.btn.icon:hover,.top-actions>#cloud-sync-top:hover{background:var(--surface-2)!important;border-color:var(--border)!important;color:var(--ink)!important}
.top-actions>#cloud-sync-top[data-state="ok"]{color:var(--positive)!important}
.top-actions>#cloud-sync-top[data-state="ready"],.top-actions>#cloud-sync-top[data-state="paused"]{color:var(--warn)!important}
.top-actions>#cloud-sync-top[data-state="error"],.top-actions>#cloud-sync-top[data-state="conflict"]{color:var(--danger)!important}
.top-actions>#cloud-sync-top[data-state="syncing"]{color:var(--accent)!important}
.content{max-width:var(--max)!important;padding:43px 28px 88px!important}
.page-title,.library-intro h1{font-size:clamp(27px,3vw,34px)!important;line-height:1.16!important;letter-spacing:-.95px!important;font-weight:765!important}
.page-desc,.library-intro p{font-size:13px!important;line-height:1.65!important;color:var(--muted)!important}
.page-header,.library-page71 .library-intro{margin-bottom:25px!important}
.section-heading h2,.library-catalog-head h2{font-size:17px!important;font-weight:740!important;letter-spacing:-.3px}
.btn{border-radius:11px!important;min-height:40px;box-shadow:none!important}
.btn.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--on-accent)!important}
.btn.primary:hover{background:var(--accent-hover)!important;border-color:var(--accent-hover)!important}
.library-page71,.library-page,.home-page{max-width:100%!important}

.library-resume-icon,.library-page71 .library-resume-icon{height:42px!important;width:42px!important;min-width:42px!important;border-radius:12px!important;background:var(--accent-soft)!important;border:0!important;color:var(--accent)!important}
.library-resume-text{gap:4px}
.library-resume-label{font-size:10px!important;letter-spacing:.6px!important;text-transform:uppercase;font-weight:770!important;color:var(--muted)!important}
.library-resume-text>strong{font-size:14px!important;letter-spacing:-.1px}
.library-resume-btn,.library-page71 .library-resume-btn{background:var(--surface-2)!important;color:var(--ink)!important;border:1px solid var(--border-strong)!important}
.library-resume-btn:hover,.library-page71 .library-resume-btn:hover{background:var(--accent-soft)!important;color:var(--accent)!important}
.library-catalog-head{margin-bottom:14px!important;gap:16px!important}
.library-add-button,.library-page71 .library-add-button{background:transparent!important;border:1px solid var(--border)!important;color:var(--muted)!important;min-height:39px!important;border-radius:10px!important}
.library-add-button:hover{background:var(--surface-2)!important;color:var(--ink)!important}
.library-course-list,.library-list-grid{background:transparent!important;border:0!important;overflow:visible!important;display:grid!important;gap:10px!important;border-radius:0!important}
.library-course-row.course-card,.library-list-item{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:14px!important;min-height:82px!important;overflow:hidden!important;box-shadow:none!important;transition:background .14s,border-color .14s!important}
.library-course-row.course-card:hover,.library-list-item:hover{background:var(--surface-2)!important;border-color:var(--border-strong)!important}
.library-course-row .library-course-open{min-height:80px!important;padding:13px 18px!important;gap:15px!important}
.library-course-thumb{height:49px!important;width:49px!important;flex:0 0 49px!important;overflow:hidden!important;background:var(--surface-2)!important;border:1px solid var(--border)!important;border-radius:12px!important}
.library-course-thumb img{max-height:100%!important;max-width:100%!important;width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important}
.library-list-visual{width:50px!important;height:50px!important;min-width:50px!important;flex:0 0 50px!important;border-radius:12px!important}
.library-list-visual.has-logo{background:transparent!important;border:0!important}
.library-list-visual img.library-list-logo{width:100%!important;height:100%!important;object-fit:contain!important}
.library-course-copy strong,.library-list-copy strong{font-size:14px!important;line-height:1.43!important;font-weight:725!important;letter-spacing:-.1px}
.library-course-copy small,.library-list-copy small{font-size:12px!important;color:var(--muted)!important}
.library-course-chevron,.library-list-arrow{opacity:.75}
.library-course-edit{border-radius:10px!important;color:var(--muted)!important}
.library-course-edit:hover{background:var(--surface-3)!important;color:var(--ink)!important}
.library-filter{border-radius:11px!important;background:var(--surface)!important;min-height:40px!important}
.course-banner{border:1px solid var(--border);border-radius:17px!important;overflow:hidden}
.course-banner .course-banner-image{filter:blur(10px) brightness(.77) saturate(.92)!important;transform:scale(1.08)!important}
.overview-strip{border-radius:13px!important;box-shadow:none!important}
.rows{border-radius:15px!important}
.subject-row{min-height:76px!important}
.lesson-card{border-radius:14px!important;box-shadow:none!important}
.lesson-card .lesson-type{border-radius:11px!important}
.lesson-card:not(.inline-lesson-card) .lesson-unified-actions{gap:9px!important}
.panel,.editor-main,.editor-structure,.modal,.dashboard-customize,.empty{border-radius:16px!important;box-shadow:none!important}
.form-field .input,.form-field .select,.form-field .textarea{border-radius:10px!important}
.modal{box-shadow:0 22px 80px rgba(0,0,0,.18)!important}
@media(max-width:780px){
 :root,html[data-theme="dark"],html[data-theme="light"]{--header:66px}
 .topbar{padding-inline:15px!important;height:var(--header)!important}
 .topbar-brand{gap:8px!important;min-height:44px!important}
 .topbar-brand .brand-mark{width:37px!important;min-width:37px!important;height:37px!important;border-radius:10px!important}
 .topbar-brand #logo-mark svg{height:37px!important;width:37px!important}
 .topbar-brand-text{font-size:20px!important}
 .top-actions{gap:1px!important}
 .top-actions>.search-launch,.top-actions>.btn.icon,.top-actions>#cloud-sync-top{width:39px!important;min-width:39px!important;max-width:39px!important;height:39px!important;min-height:39px!important;max-height:39px!important}
 .content{padding:27px 16px 58px!important}
 .library-resume,.library-page71 .library-resume{padding:14px!important;gap:11px!important}
 .library-course-row .library-course-open{padding:12px 13px!important;gap:11px!important}
 .library-course-thumb{width:44px!important;height:44px!important;flex-basis:44px!important}
 .library-catalog-head{align-items:center!important}
 .page-header,.library-page71 .library-intro{gap:12px!important;margin-bottom:19px!important}
 .course-banner{border-radius:13px!important}
 .lesson-card:not(.inline-lesson-card){padding:14px!important}
 .lesson-card:not(.inline-lesson-card) .lesson-unified-actions{gap:7px!important}
}
@media(max-width:420px){
 .topbar{padding-inline:10px!important}
 .topbar-brand-text{font-size:18px!important}
 .topbar-brand .brand-mark{width:33px!important;height:33px!important;min-width:33px!important}
 .topbar-brand #logo-mark svg{height:33px!important;width:33px!important}
 .top-actions>.search-launch,.top-actions>.btn.icon,.top-actions>#cloud-sync-top{width:36px!important;min-width:36px!important;max-width:36px!important;height:36px!important;min-height:36px!important;max-height:36px!important}
 .content{padding-inline:12px!important}
 .library-resume,.library-page71 .library-resume{flex-wrap:wrap!important}
 .library-resume-text{flex:1 1 calc(100% - 54px)!important}
 .library-resume-btn{margin-left:54px!important;max-width:calc(100% - 54px)!important;width:calc(100% - 54px)!important;flex:0 1 calc(100% - 54px)!important;box-sizing:border-box!important}
 .library-course-copy strong,.library-list-copy strong{font-size:13px!important}
 .library-course-copy small,.library-list-copy small{font-size:11px!important}
 .library-course-thumb{width:42px!important;height:42px!important;flex-basis:42px!important}
}
@media(prefers-reduced-motion:reduce){.library-course-row.course-card,.library-list-item{transition:none!important}}
